# The integration overlay (§8): the stack as it ships, plus the `sipp` containers on `internal`
# that play every side of a call — the trunks that deliver an inbound call, and the phone that
# registers and answers it. Layered over compose.yaml and compose.override.yaml, the link to
# compose.ports.yaml setup.sh makes, so what CI exercises is the files an operator runs, not a copy.
#
# The harness's sipp: SIPp 3.5.1, the build `ctaloi/sipp` has published since 2017, pinned by
# digest, since the harness depends on what that release does (no TLS Asterisk's transports
# accept, `-aa` probes counted against `-m`, `play_pcap_audio` played asynchronously).
# The one pin of it: scripts/image-env.sh reads it from here for CI and test/load.
x-sipp-image: &sipp-image ctaloi/sipp:latest@sha256:c459f2340443ddcc159227efc798217dbdaad0dbe88b76b78b1a876aa271986a

# `internal` has a fixed subnet and `netns`, Asterisk's namespace, a fixed address on it, which
# `.env` names as `EXTERNAL_IPV4` (steps.sh): the ports mode writes that address into SIP and SDP
# (§9.1), and the sipp containers are peers on `internal`, not clients on the host's network, so it
# has to be the one they reach Asterisk at: a loopback address there would send every peer's RTP to
# its own loopback.
# Outside Docker's and Podman's default address pools, like test/load's own (`compose.load.yaml`).
networks:
  internal:
    ipam:
      config:
        - subnet: 10.213.47.0/24
  # The network a scanner reaches Asterisk from in `sip-ban.sh` (§5.6): outside the stack's own
  # `internal` network, whose every address `core` exempts as the stack's own. `netns` joins it
  # only for that step (`network connect`): on two networks from Asterisk's start its entrypoint
  # could bind ARI and AMI to this network's address instead of `internal`'s.
  outside:
    ipam:
      config:
        - subnet: 10.213.48.0/24

# Every service's image is the build under test, or a third-party one pinned here, and the run
# starts with them present: `pull_policy: missing` keeps a `pull` (update.sh's, host-update.sh)
# from asking a registry for an image the run already holds or none publishes.
services:
  # The namespace `asterisk` and `proxy` join, from the `proxy` image under test like compose.yaml's.
  netns:
    image: ${PROXY_IMAGE:?set by run.sh}
    pull_policy: missing
    # Asterisk reachable by name from the sipp container without publishing anything to the runner. The
    # `zamfono` alias is the CN of the placeholder TLS certificate the entrypoint generates
    # (images/asterisk/entrypoint.sh), the way test/load/stress's own baresip devices still dial
    # it (compose.stress.yaml, no §6.4 sync in that harness). `${FQDN}` is the second alias
    # `device-tls-srtp.setup.sh`'s baresip device dials instead: bring-up waits until the stack
    # FQDN's CA-issued certificate has replaced the placeholder (cert-sync.sh's
    # `await_certificate_synced`), and that certificate's only name is the FQDN, not `zamfono`.
    networks:
      internal:
        ipv4_address: 10.213.47.10
        aliases:
          - zamfono
          - ${FQDN:?set by run.sh}

  asterisk:
    image: ${ASTERISK_IMAGE:?set by run.sh}
    pull_policy: missing
    environment:
      SIP_UDP_ENABLED: 'true'
      SIP_TCP_ENABLED: 'true'

  migrate:
    image: ${MIGRATE_IMAGE:?set by run.sh}
    pull_policy: missing

  core:
    image: ${CORE_IMAGE:?set by run.sh}
    pull_policy: missing

  updater:
    image: ${UPDATER_IMAGE:?set by run.sh}
    pull_policy: missing

  api:
    image: ${API_IMAGE:?set by run.sh}
    pull_policy: missing
    # The scenarios drive the REST surface directly rather than through Caddy, so a failure is the
    # stack's own and not TLS or the proxy's. The host port is the harness's own (`API_PORT`), not
    # a fixed 3000: a developer machine usually has something on 3000 already, and Docker reports
    # the binding as published either way, so a fixed port silently tests the wrong server.
    ports:
      - '127.0.0.1:${API_PORT:-8130}:3000'

  # The same `proxy` image the stack ships (docker-bake.hcl's `proxy` target). It runs the shipped,
  # unmodified deploy/Caddyfile as-is (still mounted read-only at /etc/caddy/Caddyfile by
  # compose.yaml, and still the image's own default command), with one addition: Caddyfile.local-ca
  # mounted into /etc/caddy/global.d/, the directory deploy/Caddyfile's global options block
  # imports, adding `local_certs` there — switching automatic HTTPS to Caddy's own internal CA, so
  # cert-sync.sh can prove §6.4's certificate sync against a real Caddy issuance with no internet
  # reachable (§8, cert-sync.sh).
  proxy:
    image: ${PROXY_IMAGE:?set by run.sh}
    pull_policy: missing
    volumes:
      - ${CERT_SYNC_CADDYFILE:?set by run.sh}:/etc/caddy/global.d/local-certs.caddy:ro

  # Two sipp containers, because Asterisk identifies a trunk by source address (§5.6): one
  # address plays the trunk, the other the phone. Sharing one would make every REGISTER from the
  # phone resolve to the trunk endpoint instead.
  sipp:
    image: *sipp-image
    pull_policy: missing
    networks:
      - internal
    # An absolute path from `run.sh`: a relative one resolves against the project directory,
    # which is the run's stack directory, and Docker creates whatever it does not find, so the
    # container would mount an empty directory and every scenario would fail to load.
    volumes:
      - ${SCENARIOS_DIR:?set by run.sh}:/scenarios:ro
    # Driven by `run.sh` through `exec`; the container itself just stays up. Its init reaps what
    # the runs leave, such as the process sipp's `exec` action starts (`uas/pickup.xml`).
    entrypoint: ['sleep', 'infinity']
    init: true
    # sipp's `play_pcap_audio` sends its RTP through a raw socket. Docker grants NET_RAW by
    # default, Podman does not, so the capability is asked for explicitly.
    cap_add:
      - NET_RAW
    depends_on:
      api:
        condition: service_healthy

  sipp-phone:
    image: *sipp-image
    pull_policy: missing
    networks:
      - internal
    volumes:
      - ${SCENARIOS_DIR:?set by run.sh}:/scenarios:ro
    entrypoint: ['sleep', 'infinity']
    init: true
    # The phone speaks too where a recording needs its own voice (`uas/answer-speak.xml`).
    cap_add:
      - NET_RAW
    depends_on:
      api:
        condition: service_healthy

  # A second provider, at an address no `ip` trunk's `identify` matches: its calls are recognised
  # by the registered contact's `line` tag or by digest authentication alone (§9.4 "Inbound
  # identification"), never by where they come from.
  sipp-provider:
    image: *sipp-image
    pull_policy: missing
    networks:
      - internal
    volumes:
      - ${SCENARIOS_DIR:?set by run.sh}:/scenarios:ro
    entrypoint: ['sleep', 'infinity']
    init: true
    depends_on:
      api:
        condition: service_healthy

  # `inbound-forward-sip`'s trunk host (§9.4 "SIP targets"): a TLS front, a few lines of Node the
  # scenario's setup runs, relaying to the `sipp` container over TCP, since the harness's sipp
  # (3.5.1) offers no TLS version Asterisk's transports accept. The scenario's setup copies its self-signed certificate
  # in and starts it; idle otherwise, like the sipp containers. It runs from the api image under
  # test, which has the Node it needs, so the harness pulls nothing from Docker Hub for it.
  sip-tls:
    image: ${API_IMAGE:?set by run.sh}
    pull_policy: missing
    networks:
      - internal
    volumes:
      - ${SCENARIOS_DIR:?set by run.sh}:/scenarios:ro
    entrypoint: ['sleep', 'infinity']
    init: true
    depends_on:
      api:
        condition: service_healthy

  # `device-tls-srtp`'s device side: baresip, the same image test/load/stress runs its Ringotel
  # stand-ins from (test/load/stress/devices/Dockerfile), registering over TLS with SDES-SRTP,
  # Opus (§3, §9.1 transport-tls, §9.3/§10.4). Idle like the sipp containers; the scenario's own
  # setup writes its config and starts it (`compose exec -d`), the way `phone.sh` drives
  # `sipp-phone`. No `NET_RAW`: unlike the sipp containers it plays no pcap. docker-bake.hcl's
  # `test-devices` target builds it.
  devices:
    image: ${DEVICES_IMAGE:?set by run.sh}
    pull_policy: missing
    networks:
      - internal
    entrypoint: ['sleep', 'infinity']
    init: true
    depends_on:
      api:
        condition: service_healthy

  # `sip-ban.sh`'s scanner (§5.6), the one container on `outside` alone: a source address `core`
  # neither exempts as the stack's own nor shares with any device the scenarios register.
  sipp-outside:
    image: *sipp-image
    pull_policy: missing
    networks:
      outside:
        ipv4_address: 10.213.48.20
    volumes:
      - ${SCENARIOS_DIR:?set by run.sh}:/scenarios:ro
    entrypoint: ['sleep', 'infinity']
    init: true
    depends_on:
      api:
        condition: service_healthy
