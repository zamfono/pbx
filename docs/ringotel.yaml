  "/api/userlogs/{orgDomain}/{fileName}":
    get:
      operationId: getLogFile
      tags:
      - Users
      summary: getLogFile
      description: 'Example URL: `https://shell.ringotel.co/api/userlogs/24368welwynroofbox/17049653948218405988-5365dfbbee1e77a7.txt`'
      parameters:
      - name: orgDomain
        in: path
        required: true
        schema:
          type: string
      - name: fileName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Log file
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key generated in the Ringotel Shell admin portal, sent as a Bearer token.
  schemas:
    RpcResponse:
      type: object
      properties:
        result:
          description: 'Method result: an object, an array of objects, or absent for methods that return no data.'
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
    getOrganizationsRequest:
      type: object
      required:
      - method
      properties:
        method:
          type: string
          const: getOrganizations
        params:
          type: object
          additionalProperties: true
      description: |-
        #### Get organizations

        Returns the list of all organizations created under your Ringotel account

        ---

        #### Parameters

        *none*

        ---

        #### Results

        ###### **`id`** **string**

        Organization ID.

        ###### **`created`** **int**

        Organization creation timestamp in unix-time format

        ###### **`domain`** **string**

        Organization domain

        ###### **`name`** **string**

        Organization name

        ###### **`admlogin`** **string**

        Organization admin login

        ###### **`options`** **int**

        Reserved parameter

        `params` **object**

        Additional organization settings.

        - `admperms` **int**. Allow billable changes for the organization admin, such as create/import/activate/delete users and connections.
        - `emailcc` **array**. Send welcome emails to these CC addresses.
        - `tags` **array**. Organization tags.
        - `hidePassInEmail` **boolean**. Do not send users' passwords in plain text.
        - `lang` **string**. Wlecome email language. Provide ISO 639 alpha-2 language code, e.g. "de". Default "en".

        ###### **`packageid`** **int**

        Organization package ID. Defines the features available to the users of this organization.

        \* see possible values below

        ###### **`region`** **string**

        Organization region where it was created

        \* see possible values below

        ###### **`status`** **int**

        Organization status

        \* see possible values below

        ---

        ###### ***possible values for*** `_**packageid**_`

        | id  | package    |
        |-----|------------|
        | 1   | Essentials |
        | 2   | Pro        |

        ###### ***possible values for*** `_**region**_`

        | id  | region                   |
        |-----|--------------------------|
        | 1   | US East                  |
        | 2   | US West                  |
        | 3   | Europe (Frankfurt)       |
        | 4   | Asia Pacific (Singapore) |
        | 5   | Europe (London)          |
        | 6   | India                    |
        | 7   | Australia                |
        | 8   | Europe (Dublin           |
        | 9   | Canada (Central)         |
        | 10  | South Africa             |

        ###### ***possible values for*** `_**status**_`

        | id  | status   |
        |-----|----------|
        | 0   | Disabled |
        | 1   | Enabled  |

        ---
      examples:
      - method: getOrganizations
        params: {}
      x-group: Organizations
    createOrganizationRequest:
      type: object
      required:
      - method
      properties:
        method:
          type: string
          const: createOrganization
        params:
          type: object
          additionalProperties: true
          properties:
            name:
              type: string
              description: "(Required) Organization name."
            domain:
              type: string
              description: "(Required) Unique organization domain."
            region:
              type: string
              description: |-
                (Required) Region ID. Choose the region closest to your users location. You won't be able to change it later.

                *\* see possible values below*
            admlogin:
              type: string
              description: Organization admin login (email address) to access the admin portal to manage that specific organization.
            admpassw:
              type: string
              description: |-
                Organization admin password to access the admin portal to manage that specific organization.

                `params` **object**

                Additional organization settings.

                - `admperms` **int**. Allow billable changes for the organization admin, such as create/import/activate/delete users and connections.
                - `emailcc` **array**. Send welcome emails to these CC addresses.
                - `tags` **array**. Organization tags.
                - `hidePassInEmail` **boolean**. Do not send users' passwords in plain text.
                - `lang` **string**. Wlecome email language. Provide ISO 639 alpha-2 language code, e.g. "de". Default "en".
            packageid:
              type: integer
              description: |-
                The organization package. Determines the features available to the users

                \* see possible values below
            id:
              type: string
              description: Organization ID
      description: |-
        #### Create a new organization

        ---

        #### Parameters

        ###### **`name`** **string**

        (Required) Organization name.

        ###### **`domain`** **string**

        (Required) Unique organization domain.

        ###### **`region`** string

        (Required) Region ID. Choose the region closest to your users location. You won't be able to change it later.

        *\* see possible values below*

        ###### **`admlogin`** **string**

        Organization admin login (email address) to access the admin portal to manage that specific organization.

        ###### **`admpassw`** **string**

        Organization admin password to access the admin portal to manage that specific organization.

        `params` **object**

        Additional organization settings.

        - `admperms` **int**. Allow billable changes for the organization admin, such as create/import/activate/delete users and connections.
        - `emailcc` **array**. Send welcome emails to these CC addresses.
        - `tags` **array**. Organization tags.
        - `hidePassInEmail` **boolean**. Do not send users' passwords in plain text.
        - `lang` **string**. Wlecome email language. Provide ISO 639 alpha-2 language code, e.g. "de". Default "en".

        ###### **`packageid`** **int**

        The organization package. Determines the features available to the users

        \* see possible values below

        ---

        ###### **possible values for** **`packageid`**

        | **id** | **package** |
        |--------|-------------|
        | 1      | Essentials  |
        | 2      | Pro         |

        ---

        ###### **possible values for** **`region`**

        | id  | region                   |
        |-----|--------------------------|
