    updateBranchRequest:
      type: object
      required:
      - method
      properties:
        method:
          type: string
          const: updateBranch
        params:
          type: object
          additionalProperties: true
      description: |-
        #### Update a connection

        ---

        #### Required Parameters

        ###### **`id`** **string**

        Connection ID.

        ###### **`orgid`** **string**

        Organization ID.

        ---

        #### Optional parameters

        `provision` **object.** Same fields as `provision` in `createBranch`'s params (see the full field-by-field reference there, including which fields are read from the Shell UI bundle vs. verified live) — this file documents it once to avoid duplicating ~90 fields.

        ###### **Partial updates**

        `updateBranch` **merges** the `provision` object you send into the branch's stored one rather than replacing it whole: a key you omit keeps its previously stored value. *(Verified live 2026-09-29: a push whose `provision` omitted `keepreg` was followed by a `getBranches` that still showed `keepreg: true` from before the push.)* `docs/spec.md` §10.4 notes that Zamfono relies on the opposite assumption — that the provider writes the whole object on every push so the two sides cannot drift — which only holds if Zamfono's own `buildBranchProvision` always includes every key it cares about; a key Zamfono never sends (and never clears) stays whatever the Shell last set it to.

        `rereg` **boolean**, top-level (sibling of `provision`, not inside it). Sent as `true` only when the Shell's "Reset registrations" button (next to "Save changes" on the connection Settings tab) triggers the save; forces the connection's registrations to be reset. Omitted (not `false`) on an ordinary save. *(Shell UI bundle aa7d197e, 2026-09-29; not exercised live by this task.)*

        ---

        #### Result

        This method returns no data.

        ---
      examples:
      - method: updateBranch
        params:
          orgid: '17113178886991592783'
          id: '17120669168186229030'
          name: PBX New
          address: pbx.example.com:5060
          country: US
          provision:
            displayname: ''
            protocol: sip
            noverify: false
            nosrtp: false
            maxregs: 2
            internal: false
            extvc: false
            private: false
            multitenant: false
            inboundFormat: national
            dtmfmode: rfc2833
            regexpires: '3600'
            callpark:
              park: "*"
              retrieve: "*"
              subscribe: park+*
              slots:
              - alias: Park 1
                slot: '5901'
              - alias: Park 2
                slot: '5902'
              - alias: Park 3
                slot: '5903'
            codecs:
            - codec: G.711 Alaw
              frame: 20
            - codec: G.711 Ulaw
              frame: 20
            tones:
              Progress: Progress 1
              Ringback: United States
              Ringback2: Ringback 1
            plength: 32
            ipcheck: false
            iptable: []
            noreg: false
            app:
              g711: false
            sipheaders:
            - name: X-Auth-Token
              value: Test12#
      x-group: Connections
