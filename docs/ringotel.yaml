openapi: 3.1.0
info:
  title: Ringotel Admin API
  version: '2024-04-02'
  description: "### About Admin API\n\nThis Admin API allows you to administer your Ringotel Shell account from your backend.\n\n### Transport\n\nThis Admin API uses **JSON** as its communication format.\n\nYou can use HTTP as a transport protocol.\n\nThe server is listening to the HTTP requests over the SSL/TLS protocol on the 443 port.\n\n### Authentication and Authorization\n\nUse API Key generated in your Ringotel Shell admin portal as a Bearer token to authenticate requests on the server. Read more about Ringotel API Settings [here](https://ringotel.atlassian.net/l/cp/jazgxjQ3).\n\nAll API calls should be made to the following URL:\n\n`https://shell.ringotel.co/api`\n\n### Requests format\n\nThe requests format includes `method` and `params` fields.\\\nThe successful response from the server includes the `result` object (or array of objects in case of multiple results). In case of error, the `error` object will be returned.\n\n### Example\n\n**Request:**\n\n```\n{\n    “method”: “getBranch”, \n    “params”: { \n        \"id\":\"16029679507926612345\",\n        \"orgid\":\"16029670196176812345\" \n    }\n}\n```\n\n**Response:**\n\n```\n{ \n    “result”: { \n        \"id\": \"16029679507926612345\", \n        \"accountid\": \"16029670196176812345\", \n        \"created\": 1602967950792, \n        \"provision\": {...}, \n        \"domain\": \"mydomain\", \n        ...\n    }\n}\n```\n\n**Last revision:**\n\nApril 02, 2024."
servers:
- url: https://shell.ringotel.co
security:
- bearerAuth: []
