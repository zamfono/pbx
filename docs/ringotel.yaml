      description: |-
        ## getAccountHistory

        Retrieves the historical activity log for an account within a specified time range.

        ### Request Body

        | Field | Type | Description |
        |----|----|----|
        | `method` | string | Must be `"getAccountHistory"` |
        | `params.begin` | integer (Unix ms) | Start of the time range (Unix timestamp in milliseconds) |
        | `params.end` | integer (Unix ms) | End of the time range (Unix timestamp in milliseconds) |

        ### Example Request Body

        ```
        {
          "method": "getAccountHistory",
          "params": {
            "begin": 1666479600525,
            "end": 1666565999148
          }
        }
        ```

        ### Notes

        - Both `begin` and `end` timestamps must be provided in **milliseconds**.

        - The `end` timestamp can be omitted to extend the result to the present moment.

        - The time range should not exceed a reasonable window to avoid large response payloads.
      examples:
      - method: getAccountHistory
        params:
