      description: |-
        #### **Create Terminal Password**

        Create a new Terminal Password for registering SIP endpoints.

        NOTE: To properly create terminal password, you need to correctly specify the "protocol" parameter, which might have different values depending on the server/region where you generate the credentials. To get the list of available protocols (they are called “devices“ internally), please use the [getBranchOptions](https://documenter.getpostman.com/view/3136743/2sA35Jzf7B#0150d9b1-93b5-47bb-a624-bc907404a777) API method. It will return the list of protocols (“devices“) among other properties.

        ---

        #### Parameters

        ###### **`userid`** **string**

        User ID.

        ###### **`orgid`** **string**

        Organization ID.

        ###### `protocol` string

        A transport protocol for registering SIP endpoints. Possible values: `sip`, `sips`, `sip-tcp`.

        ###### `termpass` **string**

        (Optional) Set a terminal password instead of generating one. NOTE: The password length must match the value set in `Terminal passwrod length` option (Connection settings -\> Miscellaneous). Skip `termpass` to generate a new password.

        ---

        ---

        #### **Result**

        Returns the SIP credentials for registering SIP endpoints.

        ###### `server` string

        Server address and port for registering SIP endpoints.

        ###### `password` string

        SIP password for registering SIP endpoints.

        ###### `authname` string

        SIP authname for registering SIP endpoints.

        ###### `username` string

        SIP username for registering SIP endpoints.
