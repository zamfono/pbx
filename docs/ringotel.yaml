      description: |-
        #### **Returns available provisioning options specific to an organization's region**

        ---

        #### Parameters

        ###### **`orgid`** **string**

        The ID of your organization

        ---

        #### Result

        `devices` **array**. List of available transport protocols and associated SIP ports for generating terminal passwords. Each entry: `proto` **string** (e.g. `sips`, `sip-tcp`, or `sip:<port>` for plain UDP), `port` **int**, `name` **string** (a display label, e.g. `"TLS (5061)"`). *(Verified live 2026-09-29: returned `sips`/5061, `sip-tcp`/5062, `sip:5070`/5070.)*

        `tones` **object**. Contains lists of available Ringback and Progress tones, keyed by tone-set name (`Ringback`, `Ringback2`, `Progress` — matching `provision.tones` in `createBranch`/`updateBranch` above); each value is an array of tone label strings (`Ringback`'s labels are country names, e.g. `"United States"`, `"United Kingdom"`; `Progress`/`Ringback2` are generic, e.g. `"Progress 1"`, `"Ringback 1"`). *(Verified live 2026-09-29.)*

        `services` **array**. Contains a list of available third-party integrations for this organization's region. Each entry: `id` **string**, `name` **string**, `types` **int** (a bitmask of integration categories), `logo` **string** (URL), `state` **int**, `properties` **array** of **string** (the labels of the credential fields the integration needs, e.g. `"Username"`, `"API key"`), `props` **object** (one empty-string entry per `properties` label, to be filled in when connecting the integration), and optionally `description` **string** / `options` **string**. *(Verified live 2026-09-29.)*

