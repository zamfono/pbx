        Array of template objects:

        `id` **string**. Template ID.

        `name` **string**. Template name.

        `params` **object**. A snapshot of the fields used to prefill a connection: at least `address` **string** (`host:port`, split apart again in the Shell before prefilling the address/port inputs), `country` **string** (ISO code), `provision` **object** (same shape as `provision` in `createBranch`/`updateBranch` above), and, for a hunt-group template, `huntgroup` **object**. *(Shell UI bundle; field list inferred from `onTemplateSelected()`'s use of `template.params`, not from a captured live response — ambiguous beyond these four keys.)*

