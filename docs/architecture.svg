<svg xmlns="http://www.w3.org/2000/svg" width="860" height="450" viewBox="0 0 860 450" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#333;stroke-width:1.5}
    .store{fill:#f4f4f4;stroke:#666;stroke-width:1.2}
    .outer{fill:none;stroke:#999;stroke-width:1.2;stroke-dasharray:6 4}
    .t{fill:#111}
    .s{fill:#555;font-size:12px}
    .l{stroke:#333;stroke-width:1.5;fill:none}
    .m{fill:#333;font-size:12px}
  </style>

  <rect class="outer" x="200" y="20" width="640" height="410" rx="8"/>
  <text class="s" x="216" y="42">Docker Compose — one stack per customer, one dedicated IPv4 on a shared host</text>

  <rect class="box" x="240" y="90" width="150" height="70" rx="6"/>
  <text class="t" x="315" y="119" text-anchor="middle" font-weight="600">Asterisk</text>
  <text class="s" x="315" y="139" text-anchor="middle">chan_pjsip · media</text>

  <rect class="box" x="520" y="90" width="170" height="70" rx="6"/>
  <text class="t" x="605" y="119" text-anchor="middle" font-weight="600">core (Node)</text>
  <text class="s" x="605" y="139" text-anchor="middle">ARI client · call logic</text>

  <rect class="box" x="240" y="255" width="150" height="70" rx="6"/>
  <text class="t" x="315" y="284" text-anchor="middle" font-weight="600">proxy (Caddy)</text>
  <text class="s" x="315" y="304" text-anchor="middle">TLS · in Asterisk's netns</text>

  <rect class="box" x="520" y="250" width="170" height="80" rx="6"/>
  <text class="t" x="605" y="279" text-anchor="middle" font-weight="600">api (Node, SvelteKit)</text>
  <text class="s" x="605" y="299" text-anchor="middle">operations · REST · OAuth</text>
  <text class="s" x="605" y="315" text-anchor="middle">MCP · /events · UI</text>

  <rect class="store" x="240" y="375" width="450" height="40" rx="4"/>
  <text class="s" x="465" y="392" text-anchor="middle">shared volumes</text>
  <text class="s" x="465" y="407" text-anchor="middle" font-size="11">media (asterisk · core · api) · SQLite WAL (core · api) · asterisk-config (api → asterisk)</text>

  <text class="t" x="20" y="120" font-weight="600">SIP / RTP</text>
  <text class="s" x="20" y="138">trunks, softphones</text>
  <text class="t" x="20" y="285" font-weight="600">HTTPS / WSS</text>
  <text class="s" x="20" y="303">admins, integrations, MCP clients</text>

  <line class="l" x1="130" y1="125" x2="238" y2="125" marker-start="url(#a)" marker-end="url(#a)"/>
  <line class="l" x1="392" y1="125" x2="518" y2="125" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="m" x="455" y="115" text-anchor="middle">ARI (WS + REST)</text>
  <line class="l" x1="605" y1="162" x2="605" y2="248" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="m" x="615" y="209">internal HTTP + WS</text>
  <line class="l" x1="150" y1="290" x2="238" y2="290" marker-start="url(#a)" marker-end="url(#a)"/>
  <line class="l" x1="392" y1="290" x2="518" y2="290" marker-end="url(#a)"/>
  <text class="m" x="455" y="280" text-anchor="middle">reverse proxy</text>
  <line class="l" x1="605" y1="332" x2="605" y2="373"/>
  <polyline class="l" points="692,125 740,125 740,395 692,395"/>
</svg>
