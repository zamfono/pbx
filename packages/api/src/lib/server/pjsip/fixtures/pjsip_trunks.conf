[trunk-t1]
type = auth
auth_type = userpass
username = trunkuser
password = trunkpass1234567890

[trunk-t1]
type = aor
contact = sip:sip.provider-a.example

[trunk-t1]
type = identify
endpoint = trunk-t1
match = 198.51.100.5
match = sip.provider-a.example
srv_lookups = yes

[trunk-t1]
type = registration
transport = transport-udp
outbound_auth = trunk-t1
client_uri = sip:trunkuser@sip.provider-a.example
server_uri = sip:sip.provider-a.example
contact_user = trunkuser
line = yes
support_outbound = yes
expiration = 3600
retry_interval = 30
forbidden_retry_interval = 30
fatal_retry_interval = 30
max_retries = 4294967295
auth_rejection_permanent = no
endpoint = trunk-t1

[trunk-t1]
type = endpoint
context = from-trunk
allow = !all,opus,g722,alaw
aors = trunk-t1
transport = transport-udp
direct_media = no
send_connected_line = no
send_diversion = no
dtmf_mode = auto
outbound_auth = trunk-t1
identify_by = ip

