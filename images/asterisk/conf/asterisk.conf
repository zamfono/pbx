; The master config file, required for a clean start: Asterisk logs "Unable to open specified
; master config file" on every daemon start and CLI command while it is missing.
; [directories] names the astdb's directory alone: every other directory keeps the package's
; built-in default, which already matches its own install layout, and hardcoding one here would
; tie the image to one architecture's module directory. The astdb holds the PJSIP contacts
; (sorcery.conf) and gets a directory of its own because that directory is a volume
; (deploy/compose.yaml `astdb`), so registrations survive a recreated container while the rest
; of /var/lib/asterisk stays the image's own (spec §9.1).
[directories]
astdbdir => /var/lib/asterisk/astdb

[options]
