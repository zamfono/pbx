; Asterisk writes no log file: one would grow in the container's writable layer without bound.
; The console is the container's log, which the container runtime keeps and caps (spec §7).
[general]
; No queue runs here, so the queue log would only be one more file.
queue_log = no

; `security` is the level res_security_log writes failed authentications and unidentified
; requests to (§5.6); Asterisk drops it unless a channel names it.
[logfiles]
console => notice,warning,error,security
