[general]

; `full` at notice level by default (spec §7); not debug/verbose, which would grow this file in
; the container's writable layer without bound.
; `security` is the level res_security_log writes failed authentications and unidentified
; requests to (§5.6); Asterisk drops it unless a channel names it, so the console, which is the
; container's log, and `full` carry it.
[logfiles]
console => notice,warning,error,security
messages => notice,warning,error
full => notice,warning,error,security
