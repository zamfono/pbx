; /etc/asterisk/indications.conf (spec §9.1, §9.4 "Cross-trunk failover"). The failed-call tone is
; ITU-T E.180's special information tone for every tenant (§9.1);
; this is the whole file, one zone, rather than the asterisk package's own indications.conf.sample
; with a zone appended to it. `core` (packages/core/src/indications.ts) always plays `tone:info` in
; this zone, whatever the tenant's `settings.country`.
;
; The other tones here are the generic ITU-T E.180/E.182 recommendation values several of the
; package sample's own European zones cited the same ITU reference for (e.g. [at], [de], [ch]): a
; continuous 425 Hz dial tone, a 500 ms on/500 ms off busy tone and a 1 s on/4 s off ring tone.
; `info` is exactly the tone spec.md names for the special information tone: three rising tones
; (950, 1400, 1800 Hz) of 330 ms each, then 1000 ms of silence — and, per this file's format (no
; element here starts with `!`), it repeats indefinitely once played, which is why `core` plays it
; for a fixed duration and stops it itself rather than waiting for it to end on its own
; (`indications.ts`, `calls/playback.ts`'s `playToneAndWait`).
[itu]
description = ITU-T E.180 generic zone
ringcadence = 1000,4000
dial = 425
busy = 425/500,0/500
ring = 425/1000,0/4000
congestion = 425/200,0/200
callwaiting = 425/200,0/200,425/200,0/4000
dialrecall = 425
record = 1400/500,0/15000
info = 950/330,1400/330,1800/330,0/1000
stutter = 425+400
