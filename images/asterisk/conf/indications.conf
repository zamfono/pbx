; /etc/asterisk/indications.conf (spec §9.1). One zone for every tenant, whatever its
; `settings.country`: this is the whole file rather than the asterisk package's own
; indications.conf.sample with a zone appended to it. `core` (packages/core/src/indications.ts)
; plays its `congestion` tone for an empty parking slot, for a fixed time and stops it itself
; (`calls/playback.ts`'s `playToneAndWait`), since no element here starts with `!` and a tone
; therefore repeats until stopped.
;
; The tones are the generic ITU-T E.180/E.182 recommendation values several of the package
; sample's own European zones cited the same ITU reference for (e.g. [at], [de], [ch]): a
; continuous 425 Hz dial tone, a 500 ms on/500 ms off busy tone and a 1 s on/4 s off ring tone.
[itu]
description = ITU-T E.180 generic zone
ringcadence = 1000,4000
dial = 425
busy = 425/500,0/500
ring = 425/1000,0/4000
congestion = 425/200,0/200
callwaiting = 425/200,0/200,425/200,0/4000
dialrecall = 425
record = 1400/500,0/15000
stutter = 425+400
