; The configured PJSIP objects are stored in configuration files, never realtime, per spec
; §9.1/§9.4. `contact` is left on its default astdb storage: a contact is not configuration but
; the runtime binding a REGISTER creates, and a file-backed store cannot be written, so mapping
; it here makes every registration fail to bind while Asterisk still answers the phone 200 OK.
; `registration` and `identify` are owned by their own modules' sorcery sections, not by
; [res_pjsip]; res_pjsip_outbound_registration and res_pjsip_endpoint_identifier_ip decline to
; load when their object type is mapped under the wrong section.
[res_pjsip]
endpoint = config,pjsip.conf,criteria=type=endpoint
auth = config,pjsip.conf,criteria=type=auth
aor = config,pjsip.conf,criteria=type=aor
domain_alias = config,pjsip.conf,criteria=type=domain_alias
system = config,pjsip.conf,criteria=type=system
global = config,pjsip.conf,criteria=type=global
transport = config,pjsip.conf,criteria=type=transport

[res_pjsip_outbound_registration]
registration = config,pjsip.conf,criteria=type=registration

[res_pjsip_endpoint_identifier_ip]
identify = config,pjsip.conf,criteria=type=identify
