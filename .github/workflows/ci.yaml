# §8 "Testing Strategy". Five jobs: the unit suites; the image builds (the six the stack ships
# plus the TLS/SRTP scenario's baresip device), saved together with the upstream image the harness
# runs into one archive; each image's own checks; and the stack brought up on each runtime. The
# last three start from that archive and run side by side. The two runtime jobs exist
# because §6.3 "Runtimes" names four features of the compose file that behave differently under
# Docker and Podman, and nothing but running it both ways tells us they still do.
#
# On a pull request the token is read-only, whoever opened it. Publishing a pull request's images
# for review is pr-images.yaml's job; it takes the archive this run uploads, and nothing else.
name: ci

on:
  pull_request:
  # Pushes to main run this through main.yaml, which publishes the images the
  # `images` job saved (§6.3 "Images"); a push trigger of its own would run it a second time.
  workflow_call:
  # A full run of any branch by hand (`gh workflow run ci --ref <branch>`), publishing nothing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      # The audio suites run ffmpeg (§10.2 "Attachments", §11.6).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      # The git tag is the only version source (§6.3 "Images", §7 "Version"); a package.json
      # "version" would be a second one nothing keeps in step with it.
      - name: No tracked package.json carries a "version" field
        run: node scripts/check-no-package-version.mjs
      # docs/spec.md §6.3 quotes deploy/compose.yaml and its overlays verbatim; nothing else keeps
      # a copy-pasted listing in step with the file it quotes.
      - name: The compose listings in docs/spec.md §6.3 match deploy/
        run: node scripts/check-spec-compose-listings.mjs
      # The Kysely types are generated from the migrations; a migration without a regenerated
      # db.d.ts fails here.
      - name: packages/shared's db.d.ts matches db/migrations
        run: npm run db:generate -w packages/shared -- --verify
      # The skill's reference copies the admin guide; tools.md is the catalog test's.
      - name: The skill's reference matches docs/guide
        run: scripts/build-skill.sh --check
      # eslint-plugin-prettier covers only the code ESLint lints; this covers everything else
      # (Markdown, YAML, CSS, JSON), with the deliberate exceptions listed in .prettierignore.
      - run: npm run format:check

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The images' names as docker-bake.hcl tags them (zamfono/<name>:ci), plus SIPP_IMAGE, the
      # upstream sipp compose.test.yaml pins: `images` pulls it into the archive, so no later job
      # pulls from Docker Hub and both runtimes bring up the same bytes. main.yaml pushes only the
      # six zamfono/ images, so it and test-devices stay unpublished.
      - name: The image names, from docker-bake.hcl
        run: scripts/image-env.sh >>"$GITHUB_ENV"
      # `use: false` leaves the runner's own builder the default, so the plain `docker build` of
      # the label step below still sees the images bake loaded into the daemon; only bake runs on
      # this one, a docker-container builder, which the gha cache needs.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
        with:
          use: false
          # The step before the save removes this builder itself, to free its disk.
          cleanup: false
      - name: Build the six images, plus the TLS/SRTP scenario's baresip device
        # docker-bake.hcl names the six targets with their Dockerfiles, contexts and tags; bake
        # builds them in parallel, and
        # `load` puts them in the local daemon. `source: .` builds this checkout, not a fetch of
        # the ref.
        #
        # The layer cache serves pull requests. On a push to main, which is what main.yaml runs
        # this for, these are the images `publish` pushes: FRESH builds them reading no cache and
        # with their base images pulled afresh, so each carries the current Debian and Node layers
        # and the packages resolved today, never a layer an older run baked; the one exception,
        # proxy's pinned Caddy compile, docker-bake.hcl's FRESH explains. Main still writes the
        # cache (CACHE_TO): a pull request may read main's cache, main never reads a pull
        # request's, so a new pull request starts from main's layers rather than from nothing.
        #
        # REVISION is the full commit each image's org.opencontainers.image.revision label (and,
        # on api/core, ZAMFONO_REVISION) carries (§6.3 "Images", §7 "Version"). `github.sha` is
        # this event's merge commit on a pull_request run, not the head a reviewer reads or
        # pr-images-tag.sh re-labels with, so a pull request build uses the actual head sha instead.
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          source: .
          files: docker-bake.hcl
          load: true
          pull: ${{ github.event_name != 'pull_request' }}
          vars: |
            FRESH=${{ github.event_name != 'pull_request' }}
            CACHE_FROM=${{ github.event_name == 'pull_request' && 'gha' || '' }}
            CACHE_TO=gha
            REVISION=${{ github.event.pull_request.head.sha || github.sha }}
      - name: Label the asterisk image with the Asterisk version it installed
        # A Dockerfile LABEL cannot read what a RUN installed, so the version is read from the built
        # image and stamped onto it by a build that adds nothing but the label. It happens before
        # the save below, so the labelled image is the one tested and published.
        run: |
          version=$(docker run --rm --entrypoint dpkg-query "$ASTERISK_IMAGE" -W -f='${Version}' asterisk)
          test -n "$version"
          echo "asterisk $version"
          echo "FROM $ASTERISK_IMAGE" \
            | docker build --label "org.zamfono.asterisk.version=$version" -t "$ASTERISK_IMAGE" -
      - name: Pull the upstream image the harness runs
        # Tagged, since an archive keeps an image's tag but not the digest it was pulled by, and
        # Podman finds the digest only on a named image.
        run: |
          docker pull "$SIPP_IMAGE"
          docker tag "$SIPP_IMAGE" "${SIPP_IMAGE%@*}"
      - name: Remove the bake builder
        # Its layer store holds a second copy of every image and their build stages, and the
        # runner's disk cannot fit that, the loaded images and the archive below at once. Bake has
        # already loaded the images into the daemon and exported the cache, so nothing needs it.
        run: |
          docker buildx rm "${{ steps.buildx.outputs.name }}"
          df -h /
      - name: Save the images for the jobs below
        # Every image scripts/image-env.sh names, sipp by the tag the step above gave it.
        run: |
          # The image names are one argument each on purpose.
          # shellcheck disable=SC2046
          docker save -o /tmp/images.tar $(scripts/image-env.sh | sed 's/^[^=]*=//; s/@.*//')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images
          path: /tmp/images.tar
          retention-days: 1

  image-tests:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images
          path: /tmp
      - run: docker load -i /tmp/images.tar
      - name: The image names, from docker-bake.hcl
        run: scripts/image-env.sh >>"$GITHUB_ENV"
      - name: Exercise each image's own checks
        # db/test.sh, deploy/test.sh and the four images/*/test.sh each check the image their
        # docker-bake.hcl variable names, the step above setting each to the one the `images` job
        # built, so nothing is built twice and what is checked is the archive main.yaml publishes,
        # asterisk with its label; run standalone, each builds its own under :test. `publish`
        # there needs this whole workflow, this job included, so a failed check stops the push
        # as a failed build does.
        run: |
          bash db/test.sh
          bash deploy/test.sh
          bash images/api/test.sh
          bash images/asterisk/test.sh
          bash images/proxy/test.sh
          bash images/updater/test.sh

  compose-docker:
    name: compose-docker (${{ matrix.shard }})
    needs: images
    runs-on: ubuntu-latest
    # Two fresh installs, the path a new operator takes, in parallel, sharing the sipp scenarios
    # (run.sh's SHARD); the last one also runs the named steps and plays fewer scenarios for them.
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images
          path: /tmp
      - run: docker load -i /tmp/images.tar
      - name: Bring the stack up and run the sipp scenarios
        run: bash test/integration/run.sh
        env:
          COMPOSE: docker compose
          SHARD: ${{ matrix.shard }}
          # run.sh collects everything there on a failure (test/integration/diagnostics.sh).
          DIAG_DIR: ${{ runner.temp }}/diagnostics
      - name: Keep the failure's diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-docker-${{ strategy.job-index }}
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore

  compose-podman:
    name: compose-podman (${{ matrix.shard }})
    needs: images
    # Podman runs healthchecks and restart policies through systemd (§6.3 "Runtimes"), so the
    # runner has to be a systemd host rather than a container. §4 asks for Podman ≥ 5: Ubuntu
    # 24.04, which `ubuntu-latest` still names, ships 4.9, while the 26.04 image carries 5.7 from
    # its own archive. The label is pinned so the move of `ubuntu-latest` cannot change it.
    runs-on: ubuntu-26.04
    # The same two runs as compose-docker's.
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    env:
      # §6.3 documents Podman rootful, so everything below runs as root. `podman compose` hands the
      # file to the docker-compose plugin and points it at `$DOCKER_HOST`; naming the rootful
      # socket here means it can never reach the runner user's rootless one, or Docker's.
      DOCKER_HOST: unix:///run/podman/podman.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images
          path: /tmp
      # Read while Docker still runs; with every one set, run.sh's own image-env.sh asks no bake.
      - name: The image names, from docker-bake.hcl
        run: scripts/image-env.sh >>"$GITHUB_ENV"
      - name: Install Podman 5
        run: |
          sudo apt-get update
          # aardvark-dns is only a Recommends of netavark, and without it no service resolves another
          # by name: core's first ARI connect to `asterisk` fails with EAI_AGAIN. catatonit, a
          # Recommends of podman, is the init the harness's idle tool services run (`init: true`).
          sudo apt-get install -y --no-install-recommends podman aardvark-dns catatonit
          version=$(sudo podman version --format '{{.Client.Version}}')
          echo "podman $version"
          if [ "${version%%.*}" -lt 5 ]; then
            echo "::error::Podman $version is older than the 5 that §4 requires" >&2
            exit 1
          fi
      - name: Serve the rootful Podman socket, with Docker out of the way
        run: |
          # The image runs Docker too. Stopping it proves nothing below falls back to Docker's
          # store; its compose plugin needs no daemon and stays, since it is the provider.
          sudo systemctl stop docker.service docker.socket
          sudo systemctl enable --now podman.socket
          sudo test -S "${DOCKER_HOST#unix://}"
          if [ "$(sudo podman info --format '{{.Host.Security.Rootless}}')" != false ]; then
            echo "::error::Podman is running rootless; §6.3 documents it rootful" >&2
            exit 1
          fi
      - run: sudo podman load -i /tmp/images.tar
      - name: Bring the stack up and run the sipp scenarios
        # `env` carries every variable run.sh reads across sudo, the image names as image-env.sh
        # printed them above; the runner's sudo-rs ignores `-E`.
        run: |
          # The variables are one argument each on purpose.
          # shellcheck disable=SC2046
          sudo env $(scripts/image-env.sh) \
            COMPOSE="$COMPOSE" DOCKER_HOST="$DOCKER_HOST" DIAG_DIR="$DIAG_DIR" SHARD="$SHARD" \
            bash test/integration/run.sh
        env:
          COMPOSE: podman compose
          SHARD: ${{ matrix.shard }}
          DIAG_DIR: ${{ runner.temp }}/diagnostics
      - name: Keep the failure's diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-podman-${{ strategy.job-index }}
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore
