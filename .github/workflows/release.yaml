# §6.3 "Images", a vX.Y.Z tag: `promote` adds X.Y.Z, X.Y, X and latest to the very manifests main
# published for that commit (main.yaml), so a release is byte-identical to the edge build it came
# from and is never rebuilt; then `bundle` publishes the GitHub release with deploy/ attached and
# the version's CHANGELOG.md section as its description, and `cleanup` drops the sha- images the
# release contains. RELEASING.md is the maintainer's side of it.
name: release

on:
  push:
    tags: ['v*']

permissions: {}

# One run per tag at a time; a re-pushed tag waits for the run before it rather than overlapping.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    name: Tag the release images
    runs-on: ubuntu-latest
    # The wait below allows 45 minutes for main's run of the same commit; this leaves it room.
    timeout-minutes: 55
    permissions:
      contents: read
      packages: write
    steps:
      - name: Accept only a vX.Y.Z tag
        id: tags
        run: |
          if [[ ! $GITHUB_REF_NAME =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a release tag; releases are tagged vX.Y.Z" >&2
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          echo "tags=$major.$minor.$patch $major.$minor $major latest" >>"$GITHUB_OUTPUT"
      # Full history and origin/main, to check the tagged commit is one main has published.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The release's description is its CHANGELOG.md section (`bundle` below); a tag nobody wrote
      # notes for stops here, before any image is tagged, rather than after a half release.
      - name: Require the release's section in CHANGELOG.md
        run: |
          git show "$GITHUB_REF:CHANGELOG.md" >"$RUNNER_TEMP/CHANGELOG.md"
          bash .github/scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/CHANGELOG.md" >/dev/null
      - name: Require the tagged commit to be on main
        id: commit
        run: |
          # ^{commit} peels an annotated tag to the commit it names.
          commit=$(git rev-parse "$GITHUB_REF^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$GITHUB_REF_NAME is on $commit, which is not on main; a release tag must be on a commit that went through main" >&2
            exit 1
          fi
          echo "short=${commit::7}" >>"$GITHUB_OUTPUT"
      # crane, logged in to ghcr.io with this job's token.
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.22.1
      - name: Add the release tags to main's build of that commit
        env:
          REPOSITORY: ghcr.io/zamfono
          IMAGES: asterisk migrate core api proxy updater
          # A commit pushed together with its tag is still in main's CI when this starts.
          WAIT_TIMEOUT: 2700
          WAIT_INTERVAL: 30
          SOURCE_TAG: sha-${{ steps.commit.outputs.short }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          # TAGS is split into one argument per tag on purpose.
          # shellcheck disable=SC2086
          bash .github/scripts/promote-release.sh "$SOURCE_TAG" $TAGS

  # The release exists only once its images carry its tags, so a bundle never names a version
  # that cannot be pulled.
  bundle:
    name: GitHub release with the bundle
    needs: promote
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Sigstore signing of the provenance below, and storing it with the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pack deploy/ with compose.yaml pinned to this release
        run: bash .github/scripts/deploy-bundle.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/bundle"
      - name: Cut the release's notes from CHANGELOG.md
        run: bash .github/scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" >"$RUNNER_TEMP/notes.md"
      # Lets an operator check a download came from this workflow at this tag:
      # gh attestation verify zamfono-deploy.tar.gz --repo zamfono/pbx
      - name: Attest the two archives' provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/bundle/SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The description is the version's CHANGELOG.md section, also on a re-run or a release a
        # maintainer opened by hand first, whose notes it replaces; the bundle is reproducible, so
        # a re-run uploads the same bytes.
        run: |
          assets=("$RUNNER_TEMP"/bundle/{zamfono-deploy.tar.gz,zamfono-deploy.zip,SHA256SUMS})
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$GITHUB_REF_NAME" --clobber "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" \
              --title "$GITHUB_REF_NAME" "${assets[@]}"
          fi

  cleanup:
    name: Prune the release's sha- images
    needs: promote
    runs-on: ubuntu-latest
    # Pruning is housekeeping: the release is out once `promote` is green, and a failure here must
    # not mark it failed.
    continue-on-error: true
    permissions:
      contents: read
      # A 403 on the DELETE means GITHUB_TOKEN lacks delete rights on the package: each package's
      # "Manage Actions access" must give the zamfono/pbx repository the Admin role.
      packages: write
    steps:
      # Full history, so each sha- tag can be resolved and checked for ancestry of the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Delete the sha- images this release contains
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: zamfono
        run: |
          bash .github/scripts/prune-sha-images.sh "$(git rev-parse "$GITHUB_REF^{commit}")" \
            asterisk migrate core api proxy updater
