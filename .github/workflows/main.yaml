# §6.3 "Images", a push to main: ci.yaml runs inside this workflow, and `publish` pushes the images
# its `images` job built and saved as edge and sha-<short sha>, so what reaches the registry is the
# build the compose jobs brought up on both runtimes. A release tag later adds its own tags to the
# very same images (release.yaml); it never builds one.
#
# A release never moves `edge`, so `latest` only ever names a release and `edge` only ever main.
name: main

on:
  push:
    branches: [main]

permissions: {}

# Runs on main wait for each other rather than overlap: an older push that finished after a newer
# one would move `edge` back to the older build. Nothing is cancelled, since a cancelled run is a
# commit whose images never appear; GitHub still keeps at most one run waiting per group, so of
# several pushes queued behind a running one only the newest publishes.
concurrency:
  group: main
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  publish:
    name: Publish edge and sha- images
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/zamfono
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images
          path: /tmp
      - run: docker load -i /tmp/images.tar
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the six images as edge and sha-<short sha>
        # zamfono/<name>:ci is what ci.yaml's env block tags them; the test-devices image in the
        # same archive is a test fixture, and the sipp image there is upstream's, so both stay
        # unpublished. The short sha is the name `promote` looks the build up by when this
        # commit is released.
        run: |
          for name in asterisk migrate core api proxy updater; do
            for tag in edge "sha-${GITHUB_SHA::7}"; do
              docker tag "zamfono/$name:ci" "$REGISTRY/$name:$tag"
              docker push "$REGISTRY/$name:$tag"
            done
          done
