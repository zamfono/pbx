# §6.3 "Images", a push to main: ci.yaml runs inside this workflow, and `publish` pushes the images
# its `images` job built and saved as edge and sha-<short sha>, so what reaches the registry is the
# build the compose jobs brought up on both runtimes and platforms. A release tag later adds its
# own tags to the very same images (release.yaml); it never builds one.
#
# A release never moves `edge`, so `latest` only ever names a release and `edge` only ever main.
name: main

on:
  push:
    branches: [main]

permissions: {}

# Runs on main wait for each other rather than overlap: an older push that finished after a newer
# one would move `edge` back to the older build. Nothing is cancelled, since a cancelled run is a
# commit whose images never appear; GitHub still keeps at most one run waiting per group, so of
# several pushes queued behind a running one only the newest publishes.
concurrency:
  group: main
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  publish:
    name: Publish edge and sha- images
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/zamfono
    steps:
      # docker-bake.hcl names the six images, and the script reads them from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            docker-bake.hcl
            .github/scripts
      # Each platform's archive, as images-amd64/images.tar and images-arm64/images.tar.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: images-*
          path: /tmp/images
      - name: Load both platforms' images
        # Both archives tag their images zamfono/<name>:ci, so each platform's are renamed
        # :ci-<arch> before the next archive takes those names. The test-devices image in them is
        # a test fixture and stays unpublished.
        run: |
          for arch in amd64 arm64; do
            docker load -i "/tmp/images/images-$arch/images.tar"
            for name in $(bash .github/scripts/stack-images.sh); do
              docker tag "zamfono/$name:ci" "zamfono/$name:ci-$arch"
            done
          done
      - name: Both platforms installed the same Asterisk
        # The Zamfono APT repository may publish one architecture's build before the other's; one
        # tag must not name two Asterisk versions.
        run: |
          label='{{index .Config.Labels "org.zamfono.asterisk.version"}}'
          amd64=$(docker image inspect --format "$label" zamfono/asterisk:ci-amd64)
          arm64=$(docker image inspect --format "$label" zamfono/asterisk:ci-arm64)
          echo "asterisk: amd64 $amd64, arm64 $arm64"
          if [ -z "$amd64" ] || [ "$amd64" != "$arm64" ]; then
            echo "::error::amd64 installed Asterisk '$amd64', arm64 '$arm64'" >&2
            exit 1
          fi
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the six images as edge and sha-<short sha>
        # One multi-platform image per name and tag (push-platforms.sh). The short sha is the name
        # `promote` looks the build up by when this commit is released.
        run: |
          for name in $(bash .github/scripts/stack-images.sh); do
            bash .github/scripts/push-platforms.sh "zamfono/$name:ci" "$REGISTRY/$name" \
              "sha-${GITHUB_SHA::7}" edge
          done
